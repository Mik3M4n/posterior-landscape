# Self-contained demo; run python examples/make_demo.py first.
[input]
file = demo.h5
coordinate1_dataset = x1
coordinate2_dataset = x2
coordinate1_name = x1
coordinate2_name = x2
coordinate1_label = $x_1$
coordinate2_label = $x_2$
domain = full
density_measure = linear
grid_location = nodes
grid_measure = linear

[analysis]
run = 2d
geometry = linear
feature_measure = linear
log_base = e
scales = 0.0, 0.075, 0.15
persistence_threshold = auto
matching_policy = coherent
ridge_region_policy = mask_supported
detect_plateaus = false
detect_shoulders = false
ordered_tails = false
curve_points = 64

[one_dimensional]
enabled = true
measure = linear

[association]
enabled = off

[compute]
workers = 1
batch_size = 16

[output]
directory = ../output/demo
profile = full

[plot]
write_pdf = true
