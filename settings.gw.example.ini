# Explicit v0.8 representation of the v0.7 GW analysis settings.
[input]
file = /path-to-density.h5
density_dataset = p
coordinate1_dataset = m1
coordinate2_dataset = m2
mask_dataset = mask
weights_dataset = weights
domain = ordered
density_measure = log
coordinate1_name = m1
coordinate2_name = m2
coordinate1_label = $m_1$
coordinate2_label = $m_2$

[analysis]
run = both
geometry = log
feature_measure = log
log_base = e
credible_mass = 0.90
scales = 0.0, 0.025, 0.05
persistence_threshold = auto
persistence_gap_min_log = 1.0
hessian_refinement = true
detect_plateaus = true
detect_shoulders = true
ordered_tails = true
minimum_support = 0.05
curve_points = 160
ridge_probability_radius = auto
support_mass = 0.995
curve_smoothing_cells = 2.0
shoulder_alpha_threshold = 2.0

[one_dimensional]
enabled = true
measure = log
density_floor = 1.0e-5
scales = 0.050, 0.075, 0.100
minimum_persistence = 2
minimum_separation_lnm = 0.050
match_tolerance_lnm = 0.100
upper_tail_percentile = 0.9999

[association]
enabled = auto
dataset = h0
chain_id_dataset = chain_id
parameter_name = H0
parameter_label = $H_0$
knn = 5
permutations = 100
uncertainty_resamples = 100
random_seed = 1729

[compute]
workers = auto
batch_size = auto
resume = true

[output]
directory = path-to-output
profile = essential
full_subdirectory = full
overwrite = false

[plot]
joint_cmap = magma
display_probability = 0.995
hpd_contours = 0.50, 0.90
write_pdf = true
