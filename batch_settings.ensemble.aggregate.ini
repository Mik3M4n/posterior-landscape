# Aggregation-only comparison of the existing synthetic posterior-ensemble runs.
# Run with:
#   python run_posterior_landscape_batch.py batch_settings.ensemble.aggregate.ini --aggregate-only
# Do not use this INI for a normal feature-finder run.

[batch]
parent_directory = output/synthetic_ensemble
run_glob = *
draws_per_chain = 1000
density_basename = synthetic_crosspass_posterior_ensemble
template_settings = output/synthetic_ensemble/base/full/settings.ini 

# Each run directory is already the batch control directory, and its completed
# products are in full/.  The patched batch runner reads full/settings.ini and
# resolves profile=full to the existing full/ artifact directory.
output_subdirectory = .
resolved_settings_filename = full/settings.ini

posterior_landscape_root = .
continue_on_error = true
dry_run = false
include =
exclude =
status_csv = output/synthetic_ensemble_comparison_status.csv 

[comparison]
enabled = true
baseline_substring = base
output_directory = output/synthetic_ensemble_comparison
write_pdf = true
write_png = false
