[input]
file = ../data/pixelpop_posterior.h5
density_dataset = p
coordinate1_dataset = m1
coordinate2_dataset = m2
mask_dataset = mask
weights_dataset = weights
domain = ordered
density_measure = log
grid_location = cell_centres
grid_measure = log
coordinate1_name = m1
coordinate2_name = m2
coordinate1_label = $m_1\,[M_\odot]$
coordinate2_label = $m_2\,[M_\odot]$
coordinate1_unit = 
coordinate2_unit = 

[analysis]
run = both
geometry = log
feature_measure = log
log_base = e
credible_mass = 0.90
scales = 0.05, 0.10, 0.15
persistence_threshold = auto
persistence_gap_min_log = 1
hessian_refinement = true
detect_plateaus = true
detect_shoulders = true
ordered_tails = true
minimum_support = 0.05
curve_points = 160
ridge_probability_radius = auto
support_mass = 0.995
curve_smoothing_cells = 2.0
shoulder_alpha_threshold = 2.0
matching_policy = coherent
ridge_region_policy = mask_supported

[one_dimensional]
enabled = true
measure = log
density_floor = 1.0e-5
scales = 0.10, 0.15, 0.20
minimum_persistence = 2
minimum_separation_lnm = 0.10
match_tolerance_lnm = 0.15
upper_tail_percentile = 0.9999

[association]
enabled = off

[compute]
workers = 2
batch_size = auto
resume = true

[output]
directory = ../output/validation_pixelpop_v088
profile = full
full_subdirectory = full
overwrite = false

[plot]
joint_cmap = magma
display_probability = 0.995
hpd_contours = 0.50, 0.90
write_pdf = true

