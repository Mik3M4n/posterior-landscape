[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posterior-landscape"
version = "0.8.6"
description = "Morphological feature analysis for two-dimensional probability-density ensembles."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michele Mancarella"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
speed = ["numba>=0.60"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
posterior-landscape = "posterior_landscape.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
