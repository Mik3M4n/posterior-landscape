[input]
file = data/synthetic_fields.h5
density_dataset = p
coordinate1_dataset = x1
coordinate2_dataset = x2
domain = full
density_measure = linear
coordinate1_name = x1
coordinate2_name = x2
coordinate1_label = $x_1$
coordinate2_label = $x_2$

[analysis]
run = 2d
geometry = linear
feature_measure = linear
scales = 0.0, 0.025, 0.05
persistence_threshold = auto
persistence_gap_min_log = 1.0
hessian_refinement = true
detect_plateaus = false
detect_shoulders = false
ordered_tails = false
credible_mass = 0.90
minimum_support = 0.05
curve_points = 160
support_mass = 0.995
curve_smoothing_cells = 2.0

[one_dimensional]
# Opt in explicitly. The finder smooths and matches in logarithmic coordinate,
# so both coordinate grids must be positive when this is enabled.
enabled = true
measure = linear
scales = 0.050, 0.075, 0.100
minimum_persistence = 2
minimum_separation_lnm = 0.050
match_tolerance_lnm = 0.100

[association]
enabled = off
dataset = lambda
chain_id_dataset = chain_id
parameter_name = lambda
parameter_label = $\lambda$
knn = 5
permutations = 100
uncertainty_resamples = 100
random_seed = 1729

[compute]
workers = auto
batch_size = auto
resume = true

[output]
directory = output/synthetic
profile = essential
overwrite = false

[plot]
joint_cmap = magma
display_probability = 0.995
hpd_contours = 0.50, 0.90
write_pdf = true
